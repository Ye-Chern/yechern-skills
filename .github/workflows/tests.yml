name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Core checks
        run: python -B skills/durable-task/scripts/test_memory.py
      - name: Core reliability
        run: python -B skills/durable-task/scripts/test_reliability.py
      - name: Cloud checks
        run: python -B -m unittest discover -s skills/durable-task-qwen-cloud/tests -v
      - name: Reading segmenter
        run: python -B -m unittest discover -s skills/progressive-reading/tests -v
      - name: Skill packages and links
        run: python -B scripts/validate_collection.py
      - name: BoundForge
        working-directory: skills/boundforge
        run: python -B -m unittest discover -s tests -v
      - name: BoundForge quickstart
        working-directory: skills/boundforge
        run: python -B examples/quickstart.py
